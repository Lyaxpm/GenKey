name: Build GenKey Android APK
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify tests, lint and APK builds
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Prepare installable debug APK and checksums
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/GenKey-v3.0-debug.apk
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GenKey-v3.0-Debug-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned release for signing
        uses: actions/upload-artifact@v4
        with:
          name: GenKey-v3.0-Release-UNSIGNED
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GenKey-validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
